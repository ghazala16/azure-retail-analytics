<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Retail Sales Analytics Platform architecture</title>
<desc>Four source systems flow through Azure Data Factory into an ADLS Gen2 bronze layer, are cleansed and aggregated by Databricks PySpark into silver and gold Delta Lake layers, and finally feed three Power BI dashboards.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  text { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .box-a { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .box-b { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .box-c { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .box-d { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #444441; }
  .arr { stroke: #888780; stroke-width: 1; fill: none; }
</style>

<rect class="box" x="20" y="30" width="150" height="56" rx="8"/><text class="th" x="95" y="52" text-anchor="middle">Store sales</text><text class="ts" x="95" y="70" text-anchor="middle">POS / SFTP</text>
<rect class="box" x="182" y="30" width="150" height="56" rx="8"/><text class="th" x="257" y="52" text-anchor="middle">Online sales</text><text class="ts" x="257" y="70" text-anchor="middle">E-commerce REST API</text>
<rect class="box" x="344" y="30" width="150" height="56" rx="8"/><text class="th" x="419" y="52" text-anchor="middle">Product catalog</text><text class="ts" x="419" y="70" text-anchor="middle">ERP flat file</text>
<rect class="box" x="506" y="30" width="150" height="56" rx="8"/><text class="th" x="581" y="52" text-anchor="middle">Store master</text><text class="ts" x="581" y="70" text-anchor="middle">ERP flat file</text>

<line x1="95" y1="86" x2="330" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="257" y1="86" x2="330" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="419" y1="86" x2="350" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="581" y1="86" x2="350" y2="146" class="arr" marker-end="url(#arrow)"/>

<rect class="box-a" x="190" y="146" width="300" height="56" rx="8"/><text class="th" x="340" y="168" text-anchor="middle">Azure Data Factory</text><text class="ts" x="340" y="186" text-anchor="middle">Copy activities, schema validation trigger</text>

<line x1="340" y1="202" x2="340" y2="242" class="arr" marker-end="url(#arrow)"/>

<rect class="box-b" x="190" y="242" width="300" height="56" rx="8"/><text class="th" x="340" y="264" text-anchor="middle">ADLS Gen2 - bronze</text><text class="ts" x="340" y="282" text-anchor="middle">Raw landed files, 520K+ records</text>

<line x1="340" y1="298" x2="340" y2="338" class="arr" marker-end="url(#arrow)"/>

<rect class="box-c" x="150" y="338" width="380" height="66" rx="8"/><text class="th" x="340" y="360" text-anchor="middle">Databricks + PySpark</text><text class="ts" x="340" y="380" text-anchor="middle">Cleansing, normalization, DQ framework</text><text class="ts" x="340" y="396" text-anchor="middle">aggregation into analytical datasets</text>

<line x1="280" y1="404" x2="240" y2="450" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="404" x2="440" y2="450" class="arr" marker-end="url(#arrow)"/>

<rect class="box-b" x="120" y="450" width="240" height="56" rx="8"/><text class="th" x="240" y="472" text-anchor="middle">ADLS Gen2 - silver</text><text class="ts" x="240" y="490" text-anchor="middle">Conformed Delta tables</text>
<rect class="box-b" x="320" y="450" width="240" height="56" rx="8"/><text class="th" x="440" y="472" text-anchor="middle">ADLS Gen2 - gold</text><text class="ts" x="440" y="490" text-anchor="middle">Delta Lake, Power BI-ready</text>

<line x1="240" y1="506" x2="440" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="506" x2="440" y2="546" class="arr" marker-end="url(#arrow)"/>

<rect class="box-d" x="270" y="546" width="340" height="56" rx="8"/><text class="th" x="440" y="568" text-anchor="middle">Power BI</text><text class="ts" x="440" y="586" text-anchor="middle">Sales performance, product trends, regional insights</text>
</svg>
